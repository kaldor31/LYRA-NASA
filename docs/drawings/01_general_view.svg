<text x="490.0" y="790.0" class="s" text-anchor="start" >Blue dashed: contours shown on the mirror</text>
<text x="490.0" y="804.0" class="s" text-anchor="start" >(head guide, torso, feet). Shaded ovals:</text>
<text x="490.0" y="818.0" class="s" text-anchor="start" >palm zones. They standardize the pose,</text>
<text x="490.0" y="832.0" class="s" text-anchor="start" >they are not a medical sensor.</text>
<text x="490.0" y="846.0" class="s" text-anchor="start" >Grey bar in top bezel: face module.</text>
<text x="490.0" y="860.0" class="s" text-anchor="start" >NFC: NFC reader on the mirror frame</text>
<text x="490.0" y="874.0" class="s" text-anchor="start" >(station, fallback ID when 3D face ID</text>
<text x="490.0" y="888.0" class="s" text-anchor="start" >is not confident; card kept at station).</text>
