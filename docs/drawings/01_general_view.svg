<text x="295.0" y="445.0" class="s" text-anchor="start" >foot restraints</text>
<text x="50.0" y="560.0" class="s" text-anchor="start" >The crew member (dashed) steps into the marked area (dashed rectangle,</text>
<text x="50.0" y="575.0" class="s" text-anchor="start" >approx. 800 x 500) and faces the touch mirror.</text>
<text x="50.0" y="590.0" class="s" text-anchor="start" >Three frames give front, side and back views; blue wedges = camera fields of view.</text>
<text x="50.0" y="605.0" class="s" text-anchor="start" >Front frame: face, chest, arms. Side frame: profile, head/trunk tilt, spine.</text>
<text x="50.0" y="620.0" class="s" text-anchor="start" >Back frame: shoulders, scapulae, pelvis, back symmetry.</text>
<text x="50.0" y="635.0" class="s" text-anchor="start" >Frames fix to floor and ceiling (e.g. seat-track rails); no free-standing legs.</text>
<text x="50.0" y="650.0" class="s" text-anchor="start" >Cameras check pose and frame quality before any capture.</text>
<text x="50.0" y="680.0" class="s" text-anchor="start" >Optional contact research module: vertical grips on the front</text>
<text x="50.0" y="695.0" class="s" text-anchor="start" >frame side posts (see sheets 2 and 3). Not part of the contactless core.</text>
<text x="490.0" y="120.0" class="vh" text-anchor="start" >Touch mirror, face view</text>
