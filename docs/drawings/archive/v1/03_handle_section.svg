<text x="1056.0" y="424.0" class="t" text-anchor="end" >half-shell</text>
<text x="1056.0" y="438.0" class="t" text-anchor="end" >split line</text>
<text x="60.0" y="640.0" class="b" text-anchor="start" >Hydrogel tape cycle (primary option)</text>
<text x="60.0" y="662.0" class="t" text-anchor="start" >1. Before each session the motor advances ≈20 mm of fresh tape</text>
<text x="60.0" y="681.0" class="t" text-anchor="start" >2. Palm rests on the tape: acoustic contact without liquid</text>
<text x="60.0" y="700.0" class="t" text-anchor="start" >3. 30 s session: Doppler, PPG/SpO₂, temperature; then 2 squeezes (grip)</text>
<text x="60.0" y="719.0" class="t" text-anchor="start" >4. Used tape winds onto the take-up spool (closed cassette)</text>
<text x="60.0" y="738.0" class="t" text-anchor="start" >5. Tape counter → reminder to replace the cassette</text>
<text x="60.0" y="770.0" class="t" text-anchor="start" >Fallback: liquid gel dispenser in the same handle (a drop on the window).</text>
<text x="640.0" y="640.0" class="b" text-anchor="start" >Honesty notes</text>
<text x="640.0" y="662.0" class="t" text-anchor="start" >• Hydrogel ultrasound pads and tape-advance mechanisms already exist;</text>
<text x="640.0" y="681.0" class="t" text-anchor="start" >   the handle cassette itself is our design (LYRA concept); no prototype yet.</text>
<text x="640.0" y="700.0" class="t" text-anchor="start" >• Ultrasound does not pass through air: a coupling medium is required.</text>
<text x="640.0" y="719.0" class="t" text-anchor="start" >• Nothing is worn on the body, no electrodes (no ECG);</text>
<text x="640.0" y="738.0" class="t" text-anchor="start" >   HRV comes from PPG/Doppler. Screening, not diagnosis.</text>
<text x="640.0" y="757.0" class="t" text-anchor="start" >• Ultrasound ≈8 to 12 MHz (superficial vessels): our estimate.</text>
<text x="640.0" y="776.0" class="t" text-anchor="start" >• NFC card stays at the station: used only if 3D face ID is unsure.</text>
</svg>
