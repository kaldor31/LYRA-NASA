<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990" width="1400" height="990">
<title>LYRA sheet 3: Doppler grip and hydrogel cassette</title>

<defs>
  <marker id="da" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#222"/></marker>
  <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  <marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/></pattern>
  <pattern id="hatch2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#777" stroke-width="0.8"/></pattern>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .t{font-size:13px;fill:#111}
    .s{font-size:11px;fill:#333}
    .xs{font-size:10px;fill:#444}
    .b{font-size:13px;fill:#111;font-weight:bold}
    .bs{font-size:11px;fill:#111;font-weight:bold}
    .h{font-size:20px;fill:#111;font-weight:bold}
    .vh{font-size:15px;fill:#111;font-weight:bold}
    .dl{font-size:12px;fill:#111}
    .ai{font-size:12px;fill:#b00020;font-weight:bold}
    .tg{font-size:9.5px;fill:#fff;font-weight:bold;letter-spacing:0.2px}
    .rt{font-size:11px;fill:#c0392b}
    .bt{font-size:11px;fill:#1f5fa8}
    .gt{font-size:11px;fill:#1a7a4a}
    .o{stroke:#1a1a1a;stroke-width:1.6;fill:none}
    .of{stroke:#1a1a1a;stroke-width:1.6;fill:#f2f2f2}
    .ofd{stroke:#1a1a1a;stroke-width:1.6;fill:#d9d9d9}
    .mir{stroke:#1a1a1a;stroke-width:1.8;fill:#e8eef4}
    .thick{stroke:#1a1a1a;stroke-width:3;fill:none}
    .post{stroke:#1a1a1a;stroke-width:1.4;fill:#bdbdbd}
    .thin{stroke:#333;stroke-width:1;fill:none}
    .hid{stroke:#444;stroke-width:1.1;fill:none;stroke-dasharray:6 4}
    .ctr{stroke:#666;stroke-width:0.9;fill:none;stroke-dasharray:14 3 3 3}
    .ex{stroke:#555;stroke-width:0.8;fill:none}
    .dim{stroke:#222;stroke-width:0.9;fill:none;marker-start:url(#da);marker-end:url(#da)}
    .ld{stroke:#333;stroke-width:0.9;fill:none}
    .fl{stroke:#222;stroke-width:1.5;fill:none}
    .fld{stroke:#222;stroke-width:1.5;fill:none;stroke-dasharray:7 4}
    .sl{fill:#c0392b;fill-opacity:0.12;stroke:#c0392b;stroke-width:1;stroke-dasharray:5 3}
    .tof{fill:#1f5fa8;fill-opacity:0.09;stroke:#1f5fa8;stroke-width:1;stroke-dasharray:5 3}
    .hum{stroke:#777;stroke-width:1.2;fill:none;stroke-dasharray:3 3}
    .cont{stroke:#1f5fa8;stroke-width:1.6;fill:none;stroke-dasharray:5 3}
    .palm{stroke:#1f5fa8;stroke-width:1.6;fill:#1f5fa8;fill-opacity:0.10}
    .gel{stroke:#1a7a4a;stroke-width:1.4;fill:#1a7a4a;fill-opacity:0.22}
    .rim{stroke:#1a1a1a;stroke-width:1.2;fill:#9e9e9e}
    .mem{stroke:#6a3d9a;stroke-width:2.2;fill:none}
    .skin{stroke:#8a5a44;stroke-width:1.4;fill:#f3d9c9}
    .ac{stroke:#c0392b;stroke-width:1.6;fill:none;marker-end:url(#fr)}
    .acd{stroke:#1f5fa8;stroke-width:1.4;fill:none;stroke-dasharray:5 3;marker-end:url(#fb)}
    .frame{stroke:#111;stroke-width:2;fill:none}
    .blk{stroke:#1a1a1a;stroke-width:1.5;fill:#fafafa}
    .blkg{stroke:#1a1a1a;stroke-width:1.5;fill:#eef3ee}
    .blkb{stroke:#1a1a1a;stroke-width:1.5;fill:#eaf0f8}
    .blkd{stroke:#555;stroke-width:1.4;fill:#fafafa;stroke-dasharray:6 4}
    .note{stroke:#b35900;stroke-width:1.5;fill:#fff8ef}
    .grp{stroke:#555;stroke-width:1;fill:none;stroke-dasharray:6 4}
  </style>
</defs>

<rect x="0" y="0" width="1400" height="990" fill="#fff"/>
<rect x="15.0" y="15.0" width="1370.0" height="960.0" rx="0" class="frame" />
<rect x="25.0" y="25.0" width="1350.0" height="940.0" rx="0" class="thin" />
<text x="45.0" y="60.0" class="h" text-anchor="start" >Sheet 3. Doppler grip and hydrogel cassette</text>
<text x="45.0" y="82.0" class="s" text-anchor="start" >LYRA concept (v3: touch mirror + three camera pillars). Concept, not a manufacturing drawing; dimensions approximate, in mm.</text>
<rect x="985" y="838" width="390" height="127" fill="#fff" stroke="#111" stroke-width="1.6"/>
<line x1="985.0" y1="872.0" x2="1375.0" y2="872.0" class="thin" />
<line x1="985.0" y1="898.0" x2="1375.0" y2="898.0" class="thin" />
<line x1="985.0" y1="924.0" x2="1375.0" y2="924.0" class="thin" />
<line x1="985.0" y1="945.0" x2="1375.0" y2="945.0" class="thin" />
<line x1="1085.0" y1="838.0" x2="1085.0" y2="872.0" class="thin" />
<line x1="1235.0" y1="898.0" x2="1235.0" y2="924.0" class="thin" />
<text x="1035.0" y="863.0" class="h" text-anchor="middle" >LYRA</text>
<text x="1095.0" y="860.0" class="b" text-anchor="start" >Doppler grip and hydrogel cassette</text>
<text x="995.0" y="890.0" class="t" text-anchor="start" >Concept, NASA Space Apps 2026</text>
<text x="1365.0" y="890.0" class="ai" text-anchor="end" >AI (SI) assisted drawing</text>
<text x="995.0" y="916.0" class="t" text-anchor="start" >Scale: NTS   Units: mm</text>
<text x="1245.0" y="916.0" class="b" text-anchor="start" >Sheet 3/5</text>
<text x="995.0" y="939.0" class="s" text-anchor="start" >Concept, not a manufacturing drawing; dimensions approximate</text>
<text x="995.0" y="959.0" class="s" text-anchor="start" >Screening aid, not a diagnosis. No medical claims.</text>
<text x="50.0" y="120.0" class="vh" text-anchor="start" >Section A-A through the vertical grip (scale enlarged, schematic)</text>
<rect x="70.0" y="150.0" width="40.0" height="640.0" rx="0" class="nc" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="90.0" y="808.0" class="s" text-anchor="middle" >mirror stand</text>
<text x="90.0" y="822.0" class="s" text-anchor="middle" >leg</text>
<rect x="110.0" y="200.0" width="70.0" height="22.0" rx="0" class="post" />
<rect x="110.0" y="718.0" width="70.0" height="22.0" rx="0" class="post" />
<rect x="180.0" y="170.0" width="120.0" height="600.0" rx="40" class="of" />
<line x1="240.0" y1="145.0" x2="240.0" y2="795.0" class="ctr" />
<text x="240.0" y="140.0" class="s" text-anchor="middle" >grip axis (vertical)</text>
<rect x="232.0" y="360.0" width="68.0" height="220.0" rx="0" class="ofd" />
<rect x="242.0" y="380.0" width="30.0" height="180.0" rx="0" class="nc" fill="url(#hatch2)" stroke="#1a1a1a" stroke-width="1"/>
<line x1="300.0" y1="370.0" x2="300.0" y2="570.0" class="thick" />
<path d="M272,580 L272,745" class="thin" />
<path d="M262,348 L314,348 L314,372 L304,372 L304,568 L314,568 L314,592 L262,592" class="o" fill="#c8c8c8" fill-opacity="0.6"/>
<rect x="304.0" y="374.0" width="26.0" height="192.0" rx="0" class="gel" />
<rect x="314.0" y="356.0" width="20.0" height="16.0" rx="4" class="rim" />
<rect x="314.0" y="568.0" width="20.0" height="16.0" rx="4" class="rim" />
<path d="M333,354 L333,586" class="mem" />
<path d="M335,300 L335,640 Q395,730 485,700 L505,270 Q415,220 335,300 Z" class="skin" />
<text x="430.0" y="560.0" class="s" text-anchor="middle" >palm (hand wraps</text>
<text x="430.0" y="574.0" class="s" text-anchor="middle" >the grip)</text>
<line x1="302.0" y1="430.0" x2="405.0" y2="430.0" class="ac" />
<line x1="302.0" y1="470.0" x2="405.0" y2="470.0" class="ac" />
<line x1="302.0" y1="510.0" x2="405.0" y2="510.0" class="ac" />
<line x1="401.0" y1="450.0" x2="304.0" y2="450.0" class="acd" />
<line x1="401.0" y1="490.0" x2="304.0" y2="490.0" class="acd" />
<text x="430.0" y="618.0" class="rt" text-anchor="middle" >pulses out (red)</text>
<text x="430.0" y="632.0" class="bt" text-anchor="middle" >echo back (blue)</text>
<rect x="330.0" y="665.0" width="175.0" height="40.0" rx="4" class="note" />
<text x="417.0" y="682.0" class="bs" text-anchor="middle" >NO AIR GAP in the</text>
<text x="417.0" y="697.0" class="bs" text-anchor="middle" >acoustic path</text>
<line x1="345.0" y1="665.0" x2="324.0" y2="550.0" class="ld" />
<circle cx="272.0" cy="348.0" r="2.2" fill="#222"/>
<line x1="272.0" y1="348.0" x2="330.0" y2="205.0" class="ld" />
<circle cx="345.0" cy="205.0" r="9.0" class="blk" />
<text x="345.0" y="209.0" class="bs" text-anchor="middle" >1</text>
<circle cx="316.0" cy="400.0" r="2.2" fill="#222"/>
<line x1="316.0" y1="400.0" x2="480.0" y2="290.0" class="ld" />
<circle cx="495.0" cy="290.0" r="9.0" class="blk" />
<text x="495.0" y="294.0" class="bs" text-anchor="middle" >2</text>
<circle cx="330.0" cy="358.0" r="2.2" fill="#222"/>
<line x1="330.0" y1="358.0" x2="420.0" y2="245.0" class="ld" />
<circle cx="435.0" cy="245.0" r="9.0" class="blk" />
<text x="435.0" y="249.0" class="bs" text-anchor="middle" >3</text>
<circle cx="333.0" cy="380.0" r="2.2" fill="#222"/>
<line x1="333.0" y1="380.0" x2="540.0" y2="330.0" class="ld" />
<circle cx="555.0" cy="330.0" r="9.0" class="blk" />
<text x="555.0" y="334.0" class="bs" text-anchor="middle" >4</text>
<circle cx="252.0" cy="570.0" r="2.2" fill="#222"/>
<line x1="252.0" y1="570.0" x2="318.0" y2="738.0" class="ld" />
<text x="322.0" y="742.0" class="s" text-anchor="start" >transducer (face toward the palm)</text>
<circle cx="299.0" cy="550.0" r="2.2" fill="#222"/>
<line x1="299.0" y1="550.0" x2="318.0" y2="762.0" class="ld" />
<text x="322.0" y="766.0" class="s" text-anchor="start" >active face (vertical, toward the palm)</text>
<text x="510.0" y="160.0" class="s" text-anchor="start" >1 holder, fixed on transducer body</text>
<text x="510.0" y="174.0" class="s" text-anchor="start" >2 thin replaceable hydrogel pad</text>
<text x="510.0" y="188.0" class="s" text-anchor="start" >   (thickness TBD by ground test)</text>
<text x="510.0" y="202.0" class="s" text-anchor="start" >3 soft protective rim (limits gel</text>
<text x="510.0" y="216.0" class="s" text-anchor="start" >   displacement)</text>
<text x="510.0" y="230.0" class="s" text-anchor="start" >4 thin membrane (contamination</text>
<text x="510.0" y="244.0" class="s" text-anchor="start" >   barrier, keeps skin contact)</text>
<text x="50.0" y="862.0" class="s" text-anchor="start" >Solid hydrogel cassette = parts 1 to 4. Pad thickness and press force: to be determined experimentally on a ground mock-up.</text>
<text x="50.0" y="878.0" class="s" text-anchor="start" >Earlier tape-cassette / liquid-gel handle idea: archived (docs/drawings/archive/v1).</text>
<rect x="790.0" y="140.0" width="580.0" height="330.0" rx="4" class="blk" />
<text x="802.0" y="162.0" class="b" text-anchor="start" >Workflow (8 steps)</text>
<circle cx="814.0" cy="188.0" r="10.0" class="blk" />
<text x="814.0" y="192.0" class="bs" text-anchor="middle" >1</text>
<text x="834.0" y="192.0" class="t" text-anchor="start" >Insert the hydrogel pad into the holder on the transducer face.</text>
<circle cx="814.0" cy="222.0" r="10.0" class="blk" />
<text x="814.0" y="226.0" class="bs" text-anchor="middle" >2</text>
<text x="834.0" y="226.0" class="t" text-anchor="start" >Check the pad for bubbles or damage.</text>
<circle cx="814.0" cy="256.0" r="10.0" class="blk" />
<text x="814.0" y="260.0" class="bs" text-anchor="middle" >3</text>
<text x="834.0" y="260.0" class="t" text-anchor="start" >Place the palm on the marked zone of the grip.</text>
<circle cx="814.0" cy="290.0" r="10.0" class="blk" />
<text x="814.0" y="294.0" class="bs" text-anchor="middle" >4</text>
<text x="834.0" y="294.0" class="t" text-anchor="start" >The cassette is gently pressed to the skin (it is not a standalone sensor).</text>
<circle cx="814.0" cy="324.0" r="10.0" class="blk" />
<text x="814.0" y="328.0" class="bs" text-anchor="middle" >5</text>
<text x="834.0" y="328.0" class="t" text-anchor="start" >The transducer sends pulses through the hydrogel.</text>
<circle cx="814.0" cy="358.0" r="10.0" class="blk" />
<text x="814.0" y="362.0" class="bs" text-anchor="middle" >6</text>
<text x="834.0" y="362.0" class="t" text-anchor="start" >The receiver registers the echo.</text>
<circle cx="814.0" cy="392.0" r="10.0" class="blk" />
<text x="814.0" y="396.0" class="bs" text-anchor="middle" >7</text>
<text x="834.0" y="396.0" class="t" text-anchor="start" >Software checks contact quality and signal stability.</text>
<circle cx="814.0" cy="426.0" r="10.0" class="blk" />
<text x="814.0" y="430.0" class="bs" text-anchor="middle" >8</text>
<text x="834.0" y="430.0" class="t" text-anchor="start" >If quality is poor: ask to reposition the hand or repeat.</text>
<rect x="790.0" y="490.0" width="283.0" height="170.0" rx="4" class="blkb" />
<text x="802.0" y="512.0" class="b" text-anchor="start" >DEMO version (hackathon)</text>
<text x="802.0" y="534.0" class="t" text-anchor="start" >Mock cassette on the grip.</text>
<text x="802.0" y="552.0" class="t" text-anchor="start" >On-screen diagram of the</text>
<text x="802.0" y="570.0" class="t" text-anchor="start" >signal path (no real</text>
<text x="802.0" y="588.0" class="t" text-anchor="start" >ultrasound measurement).</text>
<rect x="1087.0" y="490.0" width="283.0" height="170.0" rx="4" class="blkg" />
<text x="1099.0" y="512.0" class="b" text-anchor="start" >EXTENDED version</text>
<text x="1099.0" y="534.0" class="t" text-anchor="start" >Real transducer only after a</text>
<text x="1099.0" y="552.0" class="t" text-anchor="start" >phantom / ground test-bench</text>
<text x="1099.0" y="570.0" class="t" text-anchor="start" >check of coupling and signal</text>
<text x="1099.0" y="588.0" class="t" text-anchor="start" >stability.</text>
<rect x="790.0" y="678.0" width="580.0" height="140.0" rx="4" class="note" />
<text x="802.0" y="700.0" class="b" text-anchor="start" >Honest scope</text>
<text x="802.0" y="722.0" class="t" text-anchor="start" >Research module, not part of the contactless core.</text>
<text x="802.0" y="740.0" class="t" text-anchor="start" >The acoustic coupling principle is published; efficiency for this</text>
<text x="802.0" y="758.0" class="t" text-anchor="start" >transducer and palm contact must be verified on a phantom /</text>
<text x="802.0" y="776.0" class="t" text-anchor="start" >ground test bench.</text>
<text x="802.0" y="794.0" class="t" text-anchor="start" >Does not assess heart, veins or cardiovascular risk.</text>
</svg>
